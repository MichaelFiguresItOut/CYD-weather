; CYD – ESP32-2432S032C-I weather station dashboard
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM4
; CYD has no working auto-flash circuit: esptool's default DTR/RTS pre-connect
; reset would boot the chip back into normal app mode before it can sync.
; Skip that reset and enter download mode manually first (see README).
board_upload.before_reset = no-reset
; Don't reset the ESP32 before uploading. You manually put it into download mode.

; board_upload.after_reset = no-reset
; REM THIS WHEN NOT TEST. Don't reset the ESP32 after uploading. Leave it in the download bootloader so we can start serial capture before the firmware runs.

; LovyanGFX + fonts push the app past the default 1.25 MB partition.
; huge_app gives a ~3.25 MB app area on the CYD's 4 MB flash (no SPIFFS needed).
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0

lib_deps =
    lovyan03/LovyanGFX@^1.1.0
    bblanchon/ArduinoJson@^7.0.0
    ; Vendored public-domain DEFLATE inflater (Mark Adler) for the SD-card PNG loader.
    ; Referenced by path so PlatformIO always builds it.
    lib/puff
